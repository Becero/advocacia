name: Deploy Locaweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Publicar site via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar secret FTP
        env:
          FTP_PASSWORD: ${{ secrets.PASS }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::O secret PASS não está configurado no repositório."
            exit 1
          fi

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Publicar em public_html
        env:
          FTP_HOST: ftp.asmjuridico1.hospedagemdesites.ws
          FTP_USER: asmjuridico1
          FTP_PASSWORD: ${{ secrets.PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<'EOF'
          set ftp:ssl-force false
          set ssl:verify-certificate false
          mirror --reverse --continue --verbose \
            --exclude-glob .git* \
            --exclude-glob .github* \
            ./ ./public_html/
          bye
          EOF
